name: おすすめ動画を毎日更新

on:
  schedule:
    - cron: '0 21 * * *'   # 毎日 06:00 (JST)
  workflow_dispatch:        # 手動実行も可能

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: おすすめを再生成（チャンネルRSS・APIキー不要）
        run: python3 gen_suggest.py

      - name: 変更があればコミット
        run: |
          if [[ -n "$(git status --porcelain suggest.js)" ]]; then
            # Service Worker のキャッシュ名を上げて確実に配信する
            cur=$(grep -o "cv-v[0-9]*" sw.js | head -1 | tr -d 'cv-')
            next=$((cur + 1))
            sed -i "s/cv-v[0-9]*/cv-v${next}/" sw.js
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add suggest.js sw.js
            git commit -m "おすすめ動画を自動更新 (cv-v${next})"
            git push
          else
            echo "変更なし"
          fi
